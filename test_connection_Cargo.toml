[package]
name = "test_connection"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "test_connection"
path = "src/bin/test_connection.rs"

[dependencies]
# HTTP clients
hyper = { version = "1.0", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "http2", "tokio"] }
tower = { version = "0.4" }
tower-service = "0.3"
http-body-util = "0.1"
ureq = { version = "2.10", features = ["json", "charset"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }

# Core utilities
tokio = { version = "1.0", features = ["full"] }
bytes = "1.5"
http = "1.0"