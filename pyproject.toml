[project]
name = "faster-http"
version = "0.1.0"
description = "A high-performance HTTP client for Python, powered by Rust's hyper library with httpx-compatible API"
readme = "README.md"
authors = [
    { name = "Cyberbolt", email = "735245473@qq.com" }
]
requires-python = ">=3.10"
dependencies = [
    "typing-extensions>=4.0.0",
    "uvloop>=0.21.0",
]
keywords = ["http", "client", "async", "requests", "performance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.scripts]
faster-http = "faster_http:main"

[project.urls]
Homepage = "https://github.com/cyberbolt/faster-http"
Repository = "https://github.com/cyberbolt/faster-http"
Documentation = "https://github.com/cyberbolt/faster-http#readme"
"Bug Tracker" = "https://github.com/cyberbolt/faster-http/issues"

[tool.maturin]
module-name = "faster_http._core"
python-packages = ["faster_http"]
python-source = "src"
# Ensure ABI3 is used to build wheels compatible with multiple Python versions
features = ["pyo3/abi3-py310"]
# Build optimized wheels for different platforms
strip = true

[build-system]
requires = ["maturin>=1.9.0,<1.10.0"]
build-backend = "maturin"

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=0.23.0",
    "httpx[http2]>=0.27.0",
    "requests>=2.31.0",
    "pytest-benchmark>=4.0.0",
    "maturin[patchelf]>=1.9.0",
    "fastapi>=0.115.14",
    "uvicorn[standard]>=0.35.0",
    "ruff>=0.12.1",
    "pytest-httpserver>=1.1.3",
    "pytest-xdist>=3.8.0",
    "aiohttp>=3.12.14",
    "pytest-cov>=6.2.1",
    "pytest-timeout>=2.3.1",
    "uvloop>=0.21.0",
]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "target",
]

line-length = 120
indent-width = 4
target-version = "py310"

[tool.ruff.lint]
# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default.
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "PIE", "RUF"]
ignore = [
    "E501",    # Line too long (handled by formatter)
    "N818",    # Exception name should end with Error suffix (httpx compatibility)
    "N802",    # Function name should be lowercase (HTTP method handlers)
    "SIM105",  # Use contextlib.suppress (keep explicit for clarity)
    "SIM117",  # Combine with statements (keep separate for clarity)
    "B904",    # Use raise from (not applicable for assertion errors)
    "RUF003",  # Ambiguous unicode character (Chinese comments)
    "RUF002",  # Ambiguous unicode character in docstrings (Chinese comments)
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
# Use single quotes for strings.
quote-style = "double"
# Indent with spaces, rather than tabs.
indent-style = "space"
# Respect magic trailing commas.
skip-magic-trailing-comma = false
# Automatically detect the appropriate line ending.
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["faster_http"]
force-single-line = false
force-sort-within-sections = true
single-line-exclusions = ["typing"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # Use of assert in tests is fine
    "PLR2004", # Magic values in tests are fine
    "ANN",     # No need for type annotations in tests
    "ARG",     # Unused arguments in tests are fine (fixtures)
    "FBT",     # Boolean positional args in tests are fine
]
"benchmark/**/*.py" = [
    "S101",    # Use of assert in benchmarks is fine
    "PLR2004", # Magic values in benchmarks are fine
    "ANN",     # No need for type annotations in benchmarks
    "T20",     # Print statements in benchmarks are fine
]
