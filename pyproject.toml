[project]
name = "faster-http"
version = "0.1.0"
description = "A high-performance HTTP client for Python, powered by Rust's reqwest library with httpx-compatible API"
readme = "README.md"
authors = [
    { name = "Cyberbolt", email = "735245473@qq.com" }
]
requires-python = ">=3.10"
dependencies = [
    "typing-extensions>=4.0.0",
    "uvloop>=0.21.0",
]
keywords = ["http", "client", "async", "requests", "performance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.scripts]
faster-http = "faster_http:main"

[project.urls]
Homepage = "https://github.com/cyberbolt/faster-http"
Repository = "https://github.com/cyberbolt/faster-http"
Documentation = "https://github.com/cyberbolt/faster-http#readme"
"Bug Tracker" = "https://github.com/cyberbolt/faster-http/issues"

[tool.maturin]
module-name = "faster_http._core"
python-packages = ["faster_http"]
python-source = "src"

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=0.23.0",
    "httpx[http2]>=0.27.0",
    "requests>=2.31.0",
    "pytest-benchmark>=4.0.0",
    "maturin>=1.9.0",
    "fastapi>=0.115.14",
    "uvicorn>=0.35.0",
    "ruff>=0.12.1",
    "pytest-httpserver>=1.1.3",
    "pytest-xdist>=3.8.0",
]
