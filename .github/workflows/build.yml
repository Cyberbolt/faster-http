name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test on ${{ matrix.os }} with Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']
        
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Set up Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true
        components: rustfmt, clippy
        
    - name: Cache Rust dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-
          
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true
        
    - name: Install Python dependencies
      run: uv sync --all-extras --dev
      
    - name: Install maturin
      run: uv add --dev maturin[patchelf]
      
    - name: Lint Rust code
      run: |
        cargo fmt --all -- --check
        cargo clippy --all-targets --all-features -- -D warnings
        
    - name: Lint Python code
      run: uv run ruff check src/
      
    - name: Build Rust extension
      run: uv run maturin develop --release
      
    - name: Run tests
      run: uv run -m pytest tests/ -n auto --tb=short --timeout=300
      

  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'release'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Set up Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true
        
    - name: Install maturin
      run: pip install maturin[patchelf]
      
    - name: Build wheels (Linux)
      if: matrix.os == 'ubuntu-latest'
      uses: PyO3/maturin-action@v1
      with:
        target: x86_64
        args: --release --out dist --interpreter 3.10 3.11 3.12
        sccache: 'true'
        manylinux: auto
        
    - name: Build wheels (Linux ARM64)
      if: matrix.os == 'ubuntu-latest'
      uses: PyO3/maturin-action@v1
      with:
        target: aarch64
        args: --release --out dist --interpreter 3.10 3.11 3.12
        sccache: 'true'
        manylinux: auto
        
    - name: Build wheels (macOS x86_64)
      if: matrix.os == 'macos-latest'
      uses: PyO3/maturin-action@v1
      with:
        target: x86_64
        args: --release --out dist --interpreter 3.10 3.11 3.12
        sccache: 'true'
        
    - name: Build wheels (macOS ARM64)
      if: matrix.os == 'macos-latest'
      uses: PyO3/maturin-action@v1
      with:
        target: aarch64
        args: --release --out dist --interpreter 3.10 3.11 3.12
        sccache: 'true'
        
    - name: Build wheels (Windows x86_64)
      if: matrix.os == 'windows-latest'
      uses: PyO3/maturin-action@v1
      with:
        target: x64
        args: --release --out dist --interpreter 3.10 3.11 3.12
        sccache: 'true'
        
    - name: Upload wheels
      uses: actions/upload-artifact@v3
      with:
        name: wheels-${{ matrix.os }}
        path: dist

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install maturin
      run: pip install maturin
      
    - name: Build sdist
      run: maturin sdist --out dist
      
    - name: Upload sdist
      uses: actions/upload-artifact@v3
      with:
        name: sdist
        path: dist

  release:
    name: Release to PyPI
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [test, build-wheels, build-sdist]
    environment:
      name: pypi
      url: https://pypi.org/p/faster-http
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
      
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v3
      with:
        path: dist
        
    - name: Flatten dist directory
      run: |
        find dist -name "*.whl" -exec mv {} dist/ \;
        find dist -name "*.tar.gz" -exec mv {} dist/ \;
        find dist -type d -empty -delete
        
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist/