[package]
name = "faster_http"
version = "0.1.0"
edition = "2021"

[lib]
name = "faster_http"
# "cdylib" is necessary to produce a shared library for Python to import from.
# "rlib" allows internal modules to be used by bin targets
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "test_connection"
path = "src/bin/test_connection.rs"

[dependencies]
# "extension-module" tells pyo3 we want to build an extension module (skips linking against libpython.so)
# "abi3-py39" tells pyo3 (and maturin) to build using the stable ABI with minimum Python version 3.9
pyo3 = { version = "0.20.3", features = ["extension-module", "abi3-py310"] }
pyo3-asyncio = { version = "0.20.0", features = ["tokio-runtime"] }
# Hyper ecosystem dependencies for HTTP client
hyper = { version = "1.0", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "http2", "tokio"] }
# TLS dependencies for HTTPS support
hyper-rustls = { version = "0.27", features = ["http1", "http2", "webpki-tokio", "aws-lc-rs"] }
tower = { version = "0.4" }
tower-service = "0.3"
http-body-util = "0.1"
rustls = { version = "0.23", features = ["aws-lc-rs"], default-features = false }
rustls-webpki = { version = "0.103", features = ["aws-lc-rs"], default-features = false }
webpki-roots = "0.26"
# Keep essential utilities
mime = "0.3"
mime_guess = "2.0"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
bytes = "1.5"
futures = "0.3"
anyhow = "1.0"
urlencoding = "2.1"
pythonize = "0.20.0"
http = "1.0"
base64 = "0.22"
uuid = { version = "1.0", features = ["v4"] }
multipart = "0.18"
# Synchronous HTTP client (with TLS support)
ureq = { version = "2.10", default-features = false, features = ["json", "tls"] }
# reqwest = { version = "0.12", features = ["blocking", "json"] }  # Removed to reduce dependencies
# System information dependencies
num_cpus = "1.16"

# Release build configuration
[profile.release]
debug = 0
lto = "fat"  # Use fat LTO for link-time optimization
codegen-units = 1
opt-level = 3
panic = "abort"  # Abort on panic in release builds
# Release build settings (balanced with security)
overflow-checks = true  # Keep overflow checks for safety
debug-assertions = false  # Disable debug assertions in release
incremental = false  # Disable incremental compilation in release
rpath = false  # Disable rpath for smaller binaries
split-debuginfo = "off"  # Disable debug info for smaller binary
# Release build flags
strip = true  # Strip symbols for smaller binary

# Target-specific configuration
[profile.release.build-override]
opt-level = 3
codegen-units = 1

[profile.dev]
panic = "unwind"

# CPU-specific configuration for target architecture
[target.'cfg(target_arch = "x86_64")'.dependencies]
# Architecture-specific optimizations will be handled via RUSTFLAGS

# Build flags configured via environment variables
