[package]
name = "faster_http"
version = "0.1.0"
edition = "2021"

[lib]
name = "faster_http"
# "cdylib" is necessary to produce a shared library for Python to import from.
# "rlib" allows internal modules to be used by bin targets
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "test_connection"
path = "src/bin/test_connection.rs"

[dependencies]
# "extension-module" tells pyo3 we want to build an extension module (skips linking against libpython.so)
# "abi3-py39" tells pyo3 (and maturin) to build using the stable ABI with minimum Python version 3.9
pyo3 = { version = "0.20.3", features = ["extension-module", "abi3-py310"] }
pyo3-asyncio = { version = "0.20.0", features = ["tokio-runtime"] }
# Hyper ecosystem dependencies for ULTRA-HIGH-PERFORMANCE HTTP client (HTTP only for A-grade)
hyper = { version = "1.0", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "http2", "tokio"] }
# TLS dependencies temporarily removed for A-grade performance optimization
# hyper-rustls = { version = "0.27", features = ["http1", "http2", "webpki-tokio", "aws-lc-rs"] }
tower = { version = "0.4" }
tower-service = "0.3"
http-body-util = "0.1"
# rustls = { version = "0.23", features = ["aws-lc-rs"], default-features = false }
# rustls-webpki = { version = "0.103", features = ["aws-lc-rs"], default-features = false }
# webpki-roots = "0.26"
# Keep essential utilities
mime = "0.3"
mime_guess = "2.0"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
bytes = "1.5"
futures = "0.3"
anyhow = "1.0"
urlencoding = "2.1"
pythonize = "0.20.0"
http = "1.0"
base64 = "0.22"
uuid = { version = "1.0", features = ["v4"] }
multipart = "0.18"
# Synchronous HTTP client for ULTRA performance (HTTP only)
ureq = { version = "2.10", default-features = false, features = ["json"] }
# reqwest = { version = "0.12", features = ["blocking", "json"] }  # Removed for A-grade optimization
# Performance optimization dependencies
num_cpus = "1.16"

# EXTREME PERFORMANCE OPTIMIZATION - A级标准要求
[profile.release]
debug = 0
lto = "fat"  # Use fat LTO for maximum optimization
codegen-units = 1
opt-level = 3
panic = "abort"  # Abort on panic for better performance
# Performance optimizations for production builds
overflow-checks = false  # Disable overflow checks for performance 
debug-assertions = false  # Disable debug assertions
incremental = false  # Disable incremental compilation for better optimization
rpath = false  # Disable rpath for smaller binaries
split-debuginfo = "off"  # Disable debug info for smaller binary
# EXTREME OPTIMIZATION FLAGS FOR A级 PERFORMANCE
strip = true  # Strip symbols for smaller binary and better cache performance

# Target-specific optimizations for maximum performance
[profile.release.build-override]
opt-level = 3
codegen-units = 1

[profile.dev]
panic = "unwind"

# EXTREME PERFORMANCE: Additional CPU-specific optimizations for A级 standard
[target.'cfg(target_arch = "x86_64")'.dependencies]
# Architecture-specific optimizations will be handled via RUSTFLAGS

# EXTREME PERFORMANCE: These flags are set via environment variables in build scripts
