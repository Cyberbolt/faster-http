[package]
name = "faster_http"
version = "0.1.0"
edition = "2021"

[lib]
name = "_core"
# "cdylib" is necessary to produce a shared library for Python to import from.
crate-type = ["cdylib"]

# Removed obsolete test binaries

[dependencies]
# "extension-module" tells pyo3 we want to build an extension module (skips linking against libpython.so)
# "abi3-py39" tells pyo3 (and maturin) to build using the stable ABI with minimum Python version 3.9
pyo3 = { version = "0.20.3", features = ["extension-module", "abi3-py310"] }
pyo3-asyncio = { version = "0.20.0", features = ["tokio-runtime"] }
# Hyper ecosystem dependencies for high-performance HTTP client
hyper = { version = "1.0", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "http2", "tokio"] }
hyper-rustls = { version = "0.27", features = ["http1", "http2", "webpki-tokio", "ring"] }
tower = { version = "0.4" }
tower-service = "0.3"
http-body-util = "0.1"
rustls = { version = "0.23", features = ["ring"] }
rustls-webpki = "0.102"
webpki-roots = "0.26"
# Keep essential utilities
mime = "0.3"
mime_guess = "2.0"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
bytes = "1.5"
futures = "0.3"
anyhow = "1.0"
urlencoding = "2.1"
pythonize = "0.20.0"
http = "1.0"
base64 = "0.22"
uuid = { version = "1.0", features = ["v4"] }
multipart = "0.18"

# Fix PyO3 + Tokio cleanup issues on program exit, especially on ARM64 architecture
[profile.release]
debug = 0
lto = "thin"
codegen-units = 1
opt-level = 3
panic = "unwind"

[profile.dev]
panic = "unwind"
